[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreadnought-control-plane"
version = "0.2.0b2"
description = "Experimental agent control plane with normalized missions and auditable evidence."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "grapher @ git+https://github.com/seanbman/grapher.git@v0.7.0b1",
  "prompt-toolkit>=3.0,<4"
]

[project.scripts]
dreadnought = "dreadnought.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/dreadnought.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
