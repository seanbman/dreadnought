[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreadnought-control-plane"
version = "0.1.0"
description = "Experimental agent control plane with normalized missions and auditable evidence."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "grapher @ git+https://github.com/seanbman/grapher.git@v0.6.1"
]

[project.scripts]
dreadnought = "dreadnought.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
