name: temporary-repair-grapher

on:
  push:
    branches: [fix/delegation-usage-accounting]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Invoke Dreadnought Grapher control plane
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dreadnought.grapher import GrapherControlPlane
          from dreadnought.protocol import Perspective, ProtocolRecord, RecordKind

          root = Path('.').resolve()
          record = ProtocolRecord.create(
              kind=RecordKind.NOTE,
              perspective=Perspective.OBSERVER,
              actor_id='dreadnought:bootstrap-repair',
              subject_ref='delegation-and-usage-accounting',
              data={
                  'audience': 'human',
                  'text': (
                      'Bootstrap repair: remove the silently invented zero-minion cap; '
                      'make null mean no mission-imposed delegation limit; add first-class '
                      'Codex/Cursor minion adapters and commissioning; and distinguish '
                      'unmetered primary chat sessions from measured zero token usage.'
                  ),
              },
          )
          result = GrapherControlPlane(root).write_record(record)
          graph = json.loads(result.graph_path.read_text(encoding='utf-8'))
          node = graph['nodes'][record.id]
          pass_path = root / '.grapher' / 'shared' / 'pass-records' / '2026-09-08-delegation-usage-repair.json'
          pass_path.parent.mkdir(parents=True, exist_ok=True)
          pass_path.write_text(json.dumps(node, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(record.id)
          print(result.graph_path)
          print(result.history_path)
          print(pass_path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dreadnought-grapher-repair
          path: |
            .grapher/knowledge.json
            .grapher/history.jsonl
            .grapher/shared/pass-records/2026-09-08-delegation-usage-repair.json
