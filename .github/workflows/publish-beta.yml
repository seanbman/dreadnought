name: Publish beta release

on:
  push:
    branches:
      - publish-beta

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require beta version
        shell: bash
        run: |
          case "${{ steps.version.outputs.version }}" in
            *a*|*b*|*rc*) ;;
            *) echo "Refusing to publish non-beta version" >&2; exit 1 ;;
          esac

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Linux beta for Dreadnought's human installation, direct CLI interface, and release-aware update flow.

          Install on Linux:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/seanbman/dreadnought/main/install.sh | bash
          ```

          The installer creates an isolated environment under `~/.local/share/dreadnought/venv` and links `dreadnought` into `~/.local/bin` without requiring sudo. This beta consumes the matched Grapher beta line. Interactive launches query published GitHub releases and print a non-blocking notice when a newer Dreadnought release exists; offline and non-interactive execution remain unaffected.

          This is a beta release. The long-form CLI remains the programmatic interface while the guided setup, terminal menu, agent chat, token accounting, installation, and update-discovery UX are validated.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes-file release-notes.md \
            --title "Dreadnought $TAG (Beta)"
