name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce Grapher publication evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE"...HEAD > /tmp/dreadnought-changed-files
          else
            git diff --name-only HEAD^ HEAD > /tmp/dreadnought-changed-files
          fi
          echo "Changed files:"
          cat /tmp/dreadnought-changed-files
          grep -q '^\.grapher/shared/' /tmp/dreadnought-changed-files || {
            echo 'ERROR: every substantive Dreadnought change must publish Grapher evidence under .grapher/shared/' >&2
            exit 1
          }
          PASS_RECORD=$(grep '^\.grapher/shared/pass-records/.*\.json$' /tmp/dreadnought-changed-files | head -n1 || true)
          [[ -n "$PASS_RECORD" ]] || {
            echo 'ERROR: add a Grapher pass record under .grapher/shared/pass-records/' >&2
            exit 1
          }
          python - "$PASS_RECORD" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          for key in ("id", "type", "title", "status", "provenance"):
              assert data.get(key), f"missing pass-record field: {key}"
          assert data["status"] != "unclassified", "pass record needs explicit status"
          assert data.get("semantic") or data.get("content"), "pass record needs semantic/content payload"
          assert data["provenance"].get("actor_id"), "pass record needs provenance.actor_id"
          assert data["provenance"].get("source"), "pass record needs provenance.source"
          PY
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
