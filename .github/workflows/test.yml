name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce Grapher update
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE"...HEAD > /tmp/dreadnought-changed-files
          else
            git diff --name-only HEAD^ HEAD > /tmp/dreadnought-changed-files
          fi
          echo "Changed files:"
          cat /tmp/dreadnought-changed-files
          grep -Fxq '.grapher/knowledge.json' /tmp/dreadnought-changed-files || { echo 'ERROR: every change must update .grapher/knowledge.json' >&2; exit 1; }
          grep -Fxq '.grapher/history.jsonl' /tmp/dreadnought-changed-files || { echo 'ERROR: every change must append .grapher/history.jsonl' >&2; exit 1; }
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
