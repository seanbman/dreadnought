name: fix-codex-unified-exec-kernel

on:
  push:
    branches: [fix/codex-unified-exec-under-kernel]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-unified-exec-under-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          npm install -g @openai/codex@0.153.4
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          codex --version
      - name: Patch Codex external-kernel compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/dreadnought/kernel.py')
          s = p.read_text()
          old = '''        if "--dangerously-bypass-approvals-and-sandbox" in rendered:\n            return rendered\n        for arg in rendered:\n            if arg in {"--sandbox", "-s"} or arg.startswith("--sandbox="):\n                raise ValueError(\n                    "Codex primary is externally sandboxed by Dreadnought; remove inner --sandbox options"\n                )\n        return ["--dangerously-bypass-approvals-and-sandbox", *rendered]\n'''
          new = '''        for arg in rendered:\n            if arg in {"--sandbox", "-s"} or arg.startswith("--sandbox="):\n                raise ValueError(\n                    "Codex primary is externally sandboxed by Dreadnought; remove inner --sandbox options"\n                )\n            if arg.startswith("features.unified_exec=") and arg != "features.unified_exec=false":\n                raise ValueError(\n                    "Codex unified exec is incompatible with Dreadnought's external process sandbox; "\n                    "features.unified_exec must remain false"\n                )\n        rendered = [arg for arg in rendered if arg != "--dangerously-bypass-approvals-and-sandbox"]\n        return [\n            "--dangerously-bypass-approvals-and-sandbox",\n            "-c",\n            "features.unified_exec=false",\n            *rendered,\n        ]\n'''
          if old not in s:
              raise SystemExit('kernel provider-args block not found')
          p.write_text(s.replace(old, new))

          p = Path('src/dreadnought/agent.py')
          s = p.read_text()
          old = '''            "--dangerously-bypass-approvals-and-sandbox",\n            prompt,\n'''
          new = '''            "--dangerously-bypass-approvals-and-sandbox",\n            "-c",\n            "features.unified_exec=false",\n            prompt,\n'''
          if old not in s:
              raise SystemExit('Codex minion launch block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_kernel_boundaries.py')
          s = p.read_text()
          old = '''def test_primary_codex_uses_outer_dreadnought_sandbox() -> None:\n    assert PrimaryKernel._provider_args("codex", ["--model", "x"]) == [\n        "--dangerously-bypass-approvals-and-sandbox", "--model", "x"\n    ]\n    with pytest.raises(ValueError, match="externally sandboxed"):\n        PrimaryKernel._provider_args("codex", ["--sandbox", "danger-full-access"])\n    assert PrimaryKernel._provider_args("custom", ["--sandbox", "workspace-write"]) == [\n        "--sandbox", "workspace-write"\n    ]\n'''
          new = '''def test_primary_codex_uses_outer_dreadnought_sandbox() -> None:\n    assert PrimaryKernel._provider_args("codex", ["--model", "x"]) == [\n        "--dangerously-bypass-approvals-and-sandbox",\n        "-c",\n        "features.unified_exec=false",\n        "--model",\n        "x",\n    ]\n    with pytest.raises(ValueError, match="externally sandboxed"):\n        PrimaryKernel._provider_args("codex", ["--sandbox", "danger-full-access"])\n    with pytest.raises(ValueError, match="unified exec"):\n        PrimaryKernel._provider_args("codex", ["-c", "features.unified_exec=true"])\n    assert PrimaryKernel._provider_args("custom", ["--sandbox", "workspace-write"]) == [\n        "--sandbox", "workspace-write"\n    ]\n'''
          if old not in s:
              raise SystemExit('primary codex boundary test block not found')
          s = s.replace(old, new)

          old = '''def test_primary_codex_uses_external_sandbox_bypass() -> None:\n    args = PrimaryKernel._provider_args("codex", ["--model", "x"])\n    assert args[:3] == ["--dangerously-bypass-approvals-and-sandbox", "--model", "x"]\n    with pytest.raises(ValueError, match="externally sandboxed"):\n        PrimaryKernel._provider_args("codex", ["--sandbox", "danger-full-access"])\n'''
          new = '''def test_primary_codex_uses_external_sandbox_bypass() -> None:\n    args = PrimaryKernel._provider_args("codex", ["--model", "x"])\n    assert args[:3] == [\n        "--dangerously-bypass-approvals-and-sandbox",\n        "-c",\n        "features.unified_exec=false",\n    ]\n    assert args.count("--dangerously-bypass-approvals-and-sandbox") == 1\n    with pytest.raises(ValueError, match="externally sandboxed"):\n        PrimaryKernel._provider_args("codex", ["--sandbox", "danger-full-access"])\n\n\ndef test_primary_kernel_can_spawn_repeated_child_processes(tmp_path: Path) -> None:\n    kernel = PrimaryKernel(tmp_path)\n    if not kernel.doctor()["available"]:\n        pytest.skip("bubblewrap sandbox is not operational")\n    command = [\n        "-c",\n        "set -eu; i=0; while [ $i -lt 50 ]; do /bin/true; i=$((i+1)); done; "\n        "printf child-processes-ok > /tmp/dreadnought-child-smoke; "\n        "test \\"$(cat /tmp/dreadnought-child-smoke)\\" = child-processes-ok",\n    ]\n    assert kernel.run(agent_type="custom", executable="/bin/sh", args=command) == 0\n'''
          if old not in s:
              raise SystemExit('external sandbox bypass test block not found')
          p.write_text(s.replace(old, new))

          p = Path('tests/test_minion.py')
          s = p.read_text()
          anchor = '''def test_codex_adapter_parses_turn_completed_usage() -> None:\n'''
          addition = '''def test_codex_minion_disables_unified_exec_inside_sarcophagus(tmp_path: Path) -> None:\n    adapter = CodexMinionAdapter()\n    order = Order.draft(\n        doctrine_ref="doctrine-1",\n        campaign_ref="campaign-1",\n        operation_ref="operation-1",\n        objective="Run bounded work.",\n    )\n    command = adapter.command(\n        order=order,\n        order_path=tmp_path / "order.json",\n        result_path=tmp_path / "result.jsonl",\n        scratch=tmp_path / "scratch",\n        workspace=tmp_path,\n    )\n    assert "--dangerously-bypass-approvals-and-sandbox" in command\n    idx = command.index("-c")\n    assert command[idx + 1] == "features.unified_exec=false"\n\n\n'''
          if addition.strip() not in s:
              if anchor not in s:
                  raise SystemExit('minion test anchor not found')
              p.write_text(s.replace(anchor, addition + anchor, 1))

          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text()
          needle = "For Codex providers, Dreadnought/Sarcophagus are explicitly the external sandbox: Codex is launched with its own approval and sandbox layer bypassed so nested provider sandboxes cannot break shell/process execution."
          replacement = needle + " Dreadnought also disables Codex unified exec inside this boundary because that helper process path can fail under an enclosing Bubblewrap kernel; ordinary Codex process execution remains governed by Dreadnought/Sarcophagus."
          if needle not in s:
              raise SystemExit('architecture Codex sandbox paragraph not found')
          if replacement not in s:
              p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Verify Codex CLI accepts compatibility override
        shell: bash
        run: |
          set -euo pipefail
          codex -c features.unified_exec=false --help >/dev/null
          codex exec -c features.unified_exec=false --help >/dev/null
          for i in $(seq 1 10); do
            codex -c features.unified_exec=false --version >/dev/null
          done
      - name: Run full and repeated regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          pytest -q
          pytest -q
          for i in $(seq 1 10); do
            pytest -q tests/test_kernel_boundaries.py tests/test_minion.py
          done
      - name: Record canonical Grapher mutation
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from grapher.integrations.embedded import contribute_context

          now = datetime.now(timezone.utc).isoformat(timespec='seconds')
          graph = Path('.grapher/knowledge.json')
          node = contribute_context(
              graph,
              type='implementation',
              title='Codex unified exec is disabled inside Dreadnought external kernels',
              content=json.dumps({
                  'change':'Primary and minion Codex launches force features.unified_exec=false while Dreadnought/Sarcophagus own the external Bubblewrap security boundary, avoiding unified-exec CreateProcess failures under the enclosing kernel.',
                  'component':'src/dreadnought/kernel.py; src/dreadnought/agent.py'
              }),
              node_id='implementation-codex-unified-exec-kernel-compatibility',
              path='src/dreadnought/kernel.py',
              tags=['kernel','codex','bubblewrap','unified-exec','project-arm'],
              stage='maintaining', status='current', workflow_state='completed', verification='verified',
              evidence=[
                {'type':'document','ref':'src/dreadnought/kernel.py','summary':'Primary Codex compatibility override and conflict rejection'},
                {'type':'document','ref':'src/dreadnought/agent.py','summary':'Codex minion compatibility override'},
                {'type':'document','ref':'tests/test_kernel_boundaries.py','summary':'Repeated child-process and provider-argument regressions'},
                {'type':'document','ref':'tests/test_minion.py','summary':'Minion launch regression'}
              ],
              source_refs=['tests/test_kernel_boundaries.py','tests/test_minion.py','docs/ARCHITECTURE.md'],
              scope={'project_id':'dreadnought'},
              provenance={'actor_id':'chatgpt','actor_kind':'agent','source':'github-actions','integrity':'declared','recorded_at':now},
              actor={'id':'chatgpt','kind':'agent'},
              reason='Codex unified exec returned Permission denied before any workspace command could start when Codex ran inside Dreadnought PrimaryKernel Bubblewrap.',
              evidence_refs=['src/dreadnought/kernel.py','src/dreadnought/agent.py','tests/test_kernel_boundaries.py','tests/test_minion.py','docs/ARCHITECTURE.md'],
              operation_id='codex-unified-exec-kernel-compatibility-fix', phase='executed', source='github-actions'
          )
          out = Path('.grapher/shared/pass-records/2026-09-08-codex-unified-exec-kernel.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'id':'pass-codex-unified-exec-kernel-2026-09-08',
              'type':'verification',
              'title':'Codex process execution under Dreadnought kernel',
              'status':'current',
              'provenance':{'actor_id':'chatgpt','actor_kind':'agent','source':'github-actions','recorded_at':now},
              'semantic':{
                  'graph_node':node['id'],
                  'claims':[
                      'Primary Codex forces features.unified_exec=false inside the external Dreadnought kernel',
                      'Codex minions force the same override inside Sarcophagus',
                      'Bubblewrap child-process smoke test spawns 50 children successfully',
                      'Full pytest suite passed three consecutive times and kernel/minion regressions passed ten additional consecutive runs',
                      'Codex 0.153.4 accepts the override on interactive and exec CLI surfaces'
                  ]
              }
          }, indent=2) + '\n')
          PY
          grapher validate --graph .grapher/knowledge.json --json
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-codex-unified-exec-kernel.yml
          git add src/dreadnought/kernel.py src/dreadnought/agent.py tests/test_kernel_boundaries.py tests/test_minion.py docs/ARCHITECTURE.md .grapher/knowledge.json .grapher/history.jsonl .grapher/shared/pass-records/2026-09-08-codex-unified-exec-kernel.json
          git commit -m "Fix Codex process execution inside Dreadnought kernel"
          git push origin HEAD:fix/codex-unified-exec-under-kernel
