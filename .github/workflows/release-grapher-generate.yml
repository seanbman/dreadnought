name: generate-release-grapher-provenance

on:
  push:
    branches: [release/0.2.0b4-kernel-boundaries]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.2.0b4-kernel-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Invoke Dreadnought Grapher control plane and commit release provenance
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'release-v0.2.0b4' .grapher/knowledge.json; then
            echo 'Release provenance already present.'
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from dreadnought.grapher import GrapherControlPlane
          from dreadnought.protocol import Perspective, ProtocolRecord, RecordKind

          record = ProtocolRecord.create(
              kind=RecordKind.NOTE,
              perspective=Perspective.OBSERVER,
              actor_id='dreadnought:release',
              subject_ref='release-v0.2.0b4',
              data={
                  'audience': 'human',
                  'text': (
                      'Release 0.2.0b4 packages the primary-agent kernel boundary repair from PR #30: '
                      'project-scoped max_minions, read-only canonical workspace access for the primary, '
                      'broker-only primary-to-minion communication, stripped GitHub/SSH credential channels, '
                      'and visible active unmetered primary sessions in token statistics.'
                  ),
              },
          )
          result = GrapherControlPlane(Path('.')).write_record(record)
          pass_record = {
              'id': 'pass-release-0.2.0b4-2026-09-08',
              'type': 'verification',
              'title': 'Release Dreadnought 0.2.0b4',
              'status': 'current',
              'semantic': {
                  'record_id': record.id,
                  'version': '0.2.0b4',
                  'source_merge': '162a5b71b602d635eacd3a30ab844c9380ccddd6',
              },
              'provenance': {
                  'actor_id': 'dreadnought:control-plane',
                  'source': 'dreadnought-protocol',
                  'record_id': record.id,
              },
          }
          path = Path('.grapher/shared/pass-records/2026-09-08-release-0.2.0b4.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(pass_record, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'dreadnought-control-plane'
          git config user.email 'actions@users.noreply.github.com'
          git add .grapher/knowledge.json .grapher/history.jsonl .grapher/shared/pass-records/2026-09-08-release-0.2.0b4.json
          git commit -m 'grapher: record Dreadnought 0.2.0b4 release'
          git push origin HEAD:release/0.2.0b4-kernel-boundaries
