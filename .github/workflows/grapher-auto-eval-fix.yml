name: grapher-auto-eval-fix

on:
  push:
    branches: [fix/automatic-minion-evaluation]

permissions:
  contents: write

jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-minion-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Record canonical Grapher mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from grapher.integrations.embedded import contribute_context

          now = datetime.now(timezone.utc).isoformat(timespec='seconds')
          graph_path = Path('.grapher/knowledge.json')
          node = contribute_context(
              graph_path,
              type='implementation',
              title='Project Arm completion automatically evaluates minion claims and acceptance criteria',
              content=json.dumps({
                  'change': 'After each Project Arm minion exits, Dreadnought now independently evaluates verifiable claims, rolls them up against Order acceptance criteria, emits evaluation verdicts, and marks the Order accepted only when the final verdict is supported.',
                  'component': 'src/dreadnought/evaluation.py',
              }),
              node_id='implementation-automatic-minion-evaluation',
              path='src/dreadnought/evaluation.py',
              tags=['project-arm','minion','evaluation','verification','verdict'],
              stage='maintaining',
              status='current',
              workflow_state='completed',
              verification='unverified',
              evidence=[
                  {'type':'document','ref':'src/dreadnought/evaluation.py','summary':'Evaluation pipeline'},
                  {'type':'document','ref':'tests/test_evaluation.py','summary':'Evaluation regression coverage'},
              ],
              source_refs=['src/dreadnought/dispatch.py','tests/test_evaluation.py'],
              scope={'project_id':'dreadnought'},
              provenance={'actor_id':'chatgpt','actor_kind':'agent','source':'github-actions','integrity':'declared','recorded_at':now},
              actor={'id':'chatgpt','kind':'agent'},
              reason='Wire independent verification and acceptance verdicts into Project Arm dispatch completion',
              evidence_refs=['src/dreadnought/evaluation.py','src/dreadnought/dispatch.py','tests/test_evaluation.py'],
              operation_id='automatic-minion-evaluation',
              phase='executed',
              source='github-actions',
          )
          out = Path('.grapher/shared/pass-records/2026-09-08-automatic-minion-evaluation.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              'id':'pass-automatic-minion-evaluation-2026-09-08',
              'type':'verification',
              'title':'Automatic Project Arm evaluation pipeline',
              'status':'current',
              'provenance':{'actor_id':'chatgpt','actor_kind':'agent','source':'github-actions','recorded_at':now},
              'semantic':{
                  'claims':[
                      'Dreadnought emits evaluation verdicts after minion completion',
                      'Acceptance criteria remain unverified without linked deterministic claims',
                      'A nonzero minion exit contradicts the final Order verdict',
                      'Only a supported final Order verdict sets accepted=true',
                  ],
                  'graph_node':node['id'],
                  'graph_path':str(graph_path.resolve()),
                  'history_path':str(Path('.grapher/history.jsonl').resolve()),
              },
          }, indent=2) + '\n', encoding='utf-8')
          PY
          grapher validate --graph .grapher/knowledge.json --json
      - name: Commit Grapher outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/grapher-auto-eval-fix.yml
          git add .grapher/knowledge.json .grapher/history.jsonl .grapher/shared/pass-records/2026-09-08-automatic-minion-evaluation.json
          git commit -m 'Record automatic minion evaluation in Grapher'
          git push origin HEAD:fix/automatic-minion-evaluation
